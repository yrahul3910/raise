name: Build wheels

on: [push, pull_request]

jobs:
  test_install:
    name: Test installed package on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build "pytest>=9.0.3,<10"
      - run: python -m build
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install "torch>=2.14.0,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install release wheel
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          import subprocess
          import sys

          wheels = glob.glob(os.path.join(os.environ["GITHUB_WORKSPACE"], "dist", "*.whl"))
          subprocess.run([sys.executable, "-m", "pip", "install", *wheels], check=True)
          PY
      - name: Test imports outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib "${{ github.workspace }}/tests/test_package.py" "${{ github.workspace }}/tests/test_torch_devices.py"
  test_compatibility:
    name: Test compatibility and upload coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install "torch>=2.14.0,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . "pytest>=9.0.3,<10" "pytest-cov>=7.1.0,<8"
      - name: Run compatibility tests with coverage
        working-directory: tests
        run: python -m pytest --import-mode=importlib --cov=raise_utils --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: tests/coverage.xml
          disable_search: true
          fail_ci_if_error: true

  audit_dependencies:
    name: Audit dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install "uv==0.12.14" "pip-audit>=2.10.1,<3"
      - run: uv export --frozen --no-emit-project --no-hashes --output-file requirements-audit.txt
      - run: pip-audit --no-deps --disable-pip --requirement requirements-audit.txt

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        # env:
        #   CIBW_SOME_OPTION: value

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
